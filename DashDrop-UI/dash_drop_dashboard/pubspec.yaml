name: dash_drop_dashboard
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  timeago: ^3.6.1

  cupertino_icons: ^1.0.6

  provider: ^6.1.1

  popover: ^0.2.9

  # --- Syncfusion Packages ---
  syncfusion_flutter_charts: ^31.2.18
  syncfusion_flutter_datagrid: ^31.2.18
  syncfusion_flutter_maps: any
  syncfusion_flutter_calendar: ^31.2.18
  # ---------------------------

  transparent_image: ^2.0.1

  google_fonts: any

  flutter_svg: ^2.0.9

  calendar_date_picker2: ^0.5.5

  file_picker: ^6.1.1

  hexcolor: ^3.0.1

  responsive_builder: ^0.7.0

  window_manager: ^0.3.8

  intl: any

  # تم التحديث لحل مشاكل التوافق مع Flutter الجديد
  flex_color_scheme: ^8.0.2

  avatar_glow: ^3.0.1

  json_annotation: any

  image_picker: ^0.8.7+5

  mime: ^1.0.4

  open_filex: ^4.3.2

  path_provider: ^2.0.15

  logger: ^2.2.0

  url_launcher: ^6.2.6

  path: ^1.9.0

  toastification: ^2.0.0

  iconsax_flutter: ^1.0.0

  quickalert: ^1.1.0

  rflutter_alert: ^2.0.7

  flutter_colorpicker: ^1.1.0

  multi_select_flutter: ^4.1.3
  
  flutter_bloc: ^8.1.5

  get_it: ^7.6.9

  equatable: ^2.0.5

  dio: ^5.4.2+1

  dartz: ^0.10.1

  jwt_decoder: ^2.0.1
  
  shared_preferences: ^2.2.3

  loading_animation_widget: ^1.2.1
  
  dashdrop_uikit:
    path: packages/dashdrop_uikit

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: any

flutter:
  uses-material-design: true
  # تم إضافة هذا السطر هنا لتفعيل توليد ملفات الترجمة
  generate: true

  assets:
    - assets/
    - assets/brand/
    - assets/cards/
    - assets/country/
    - assets/cover/
    - assets/icon/
    - assets/logo/
    - assets/task/
    - assets/signin/
    - assets/alert/
    - assets/toolbar/
    - assets/sidebar/
    - assets/australia.json
    - assets/routes/
    - assets/api/
    - assets/landing/

dependency_overrides:
  intl: ^0.20.2